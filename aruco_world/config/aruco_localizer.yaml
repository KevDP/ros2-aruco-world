# How far to trust one marker's fix, for aruco_localizer. Where each marker sits comes from
# marker_map.yaml, which build_world.py generates.
aruco_localizer:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    # Markers farther than this (metres) give no fix. A small marker seen nearly head-on has an
    # ambiguous orientation, so the limit suits this camera (640 px, 60 degrees) and 15 cm markers.
    max_distance: 3.0
    # Standard deviations per metre of distance: of the measured distance, and of the marker's
    # measured orientation (radians), which spreads the fix across the line of sight. Set from
    # simulated runs against Gazebo's true pose, generous enough to also cover the detector's small
    # distance bias.
    range_sigma_per_m: 0.03
    angle_sigma_per_m: 0.015
