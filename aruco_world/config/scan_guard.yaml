# Zones for scan_guard. The robot's outline is not here: the launch reads it from the URDF, so the
# zones follow the robot's real size.
scan_guard:
  ros__parameters:
    # Metres past the robot's leading edge. From the DiffDrive's top speed (0.6 m/s at 1 m/s^2),
    # reaching slow_speed takes about 0.17 m plus one scan of travel (0.06 m), well inside the
    # 0.5 m between the zones; stopping from slow_speed then takes about 1 cm. The rest is margin.
    stop_distance: 0.30
    slow_distance: 0.80
    slow_speed: 0.15  # m/s
    side_margin: 0.05  # m on each side of the robot
    min_points: 2
    # Wall-clock seconds without a scan before the robot is held still. The simulation can run
    # slower than real time, which spaces the scans out.
    scan_timeout: 0.5
    rate: 20.0  # Hz
