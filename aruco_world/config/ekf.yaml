# Two robot_localization filters, split as REP 105 describes. ekf_local (wheel odometry and gyro)
# publishes odom -> base_footprint, and ekf_global (the same plus the marker fixes) publishes
# map -> odom. Both assume a flat floor and run on the simulation's clock. The launch gives
# ekf_global the robot's start pose as its initial state.
#
# Each *_config row picks what to fuse from that input, in robot_localization's order:
#   x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az

ekf_local:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry: forward speed, turn rate, and a sideways speed of zero, since a differential
    # drive cannot move sideways.
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    # The gyro's turn rate only.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]

ekf_global:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    # Marker fixes: position and heading in the map.
    pose0: /aruco/robot_pose
    pose0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    # Mahalanobis distance from the current estimate beyond which a fix is dropped. It scales with
    # how uncertain the estimate and the fix are.
    pose0_rejection_threshold: 5.0

    # Fixes carry their image's stamp and arrive late. Keep a second of history to apply each one
    # at the time it belongs to.
    smooth_lagged_data: true
    history_length: 1.0
